<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scroller</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scroller">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--paper:#f3f4f6;--ink:#000;--sub:#5d6068;--line:#d4d6db;--field:#fff;--accent:#0a5cff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#000;--ink:#f2f2f2;--sub:#a0a3aa;--line:#2c2e33;--field:#16171a;--accent:#5b93ff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
.hidden{display:none!important}

/* Start screen */
#start{height:100%;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-left))}
#start form{width:min(100%,32rem)}
#start h1{margin:0 0 16px;font-size:2rem;font-weight:800}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;padding:12px 14px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.field button{padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
#start p{margin:14px 2px 0;color:var(--sub);font-size:.9rem;line-height:1.5}
#start a{color:var(--accent);font-weight:600}

/* Reader */
#view{height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#stage{position:relative}
#frame{border:0;display:block;transform-origin:0 0;background:#fff}
#shield{position:absolute;inset:0;z-index:1}

/* Small controls that fade out while scrolling */
#ctrl{position:fixed;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 6px));transform:translateX(-50%);z-index:2;
  display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;
  background:rgba(20,20,24,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;
  font-size:14px;transition:opacity .5s;-webkit-user-select:none;user-select:none}
#ctrl.off{opacity:0;pointer-events:none}
#ctrl button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:15px;font-weight:600}
#ctrl button:active{background:rgba(255,255,255,.18)}
#ctrl #play{background:var(--accent)}
#ctrl span{min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums;opacity:.85}
#ctrl i{width:1px;height:18px;background:rgba(255,255,255,.25);margin:0 2px}
</style>
</head>
<body>

<section id="start">
  <form id="go">
    <h1>Scroller</h1>
    <div class="field">
      <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Paste a web address" aria-label="Web address">
      <button type="submit">Open</button>
    </div>
    <p>The page scrolls by itself. Tap the page to show the buttons. Some sites do not let other apps show them. Those pages stay blank. <a href="#" id="test">Open the test page</a> to check the app.</p>
  </form>
</section>

<main id="view" class="hidden">
  <div id="stage">
    <iframe id="frame" title="Page you are reading" referrerpolicy="no-referrer"></iframe>
    <div id="shield" class="hidden"></div>
  </div>
</main>

<div id="ctrl" class="hidden">
  <button id="close" type="button" aria-label="Close page">✕</button>
  <i></i>
  <button data-k="speed" data-d="-10" type="button" aria-label="Slower">−</button>
  <span id="speedOut"></span>
  <button data-k="speed" data-d="10" type="button" aria-label="Faster">+</button>
  <i></i>
  <button data-k="size" data-d="-10" type="button" aria-label="Smaller">A−</button>
  <span id="sizeOut"></span>
  <button data-k="size" data-d="10" type="button" aria-label="Larger">A+</button>
  <i></i>
  <button id="play" type="button" aria-label="Start scrolling">▶</button>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var view=$('view'), stage=$('stage'), frame=$('frame'), shield=$('shield'), ctrl=$('ctrl'), play=$('play');
  var PAGE_H = 60000;        // tall frame, so the outer box can scroll it
  var HIDE_AFTER = 3000;     // buttons fade after this many milliseconds
  var LIMIT = { speed:[10,400], size:[40,300] };

  function load(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:+v||v; }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  var set = { speed: load('sr-speed',60), size: load('sr-size',100) };
  $('url').value = load('sr-url','');
  var on=false, last=0, acc=0, lock=null, hideT=0;

  function layout(){
    var z = set.size/100, w = Math.max(200, Math.round(view.clientWidth / z));
    frame.style.width = w+'px';
    frame.style.height = PAGE_H+'px';
    frame.style.transform = z===1 ? 'none' : 'scale('+z+')';
    stage.style.width = (w*z)+'px';
    stage.style.height = (PAGE_H*z)+'px';
  }
  function labels(){
    $('speedOut').textContent = set.speed;
    $('sizeOut').textContent = set.size+'%';
  }

  /* Buttons fade while scrolling. Tap the page to show them. */
  function show(){
    ctrl.classList.remove('off');
    clearTimeout(hideT);
    if(on) hideT = setTimeout(function(){ ctrl.classList.add('off'); }, HIDE_AFTER);
  }
  shield.addEventListener('click', show);
  ctrl.addEventListener('click', show);

  document.querySelectorAll('[data-k]').forEach(function(b){
    b.onclick = function(){
      var k=b.dataset.k, r=LIMIT[k];
      var ratio = view.scrollTop / Math.max(1, stage.offsetHeight);
      set[k] = Math.min(r[1], Math.max(r[0], set[k] + +b.dataset.d));
      save('sr-'+k, set[k]); labels();
      if(k==='size'){ layout(); view.scrollTop = ratio * stage.offsetHeight; }
    };
  });

  /* Keep the screen on while it scrolls */
  function wake(v){
    try{
      if(v && navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ lock=l; }, function(){});
      else if(!v && lock){ lock.release(); lock=null; }
    }catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && on) wake(true);
  });

  /* While stopped, the page is live, so you can tap its links. */
  function setPlay(v){
    on=v; last=0;
    play.textContent = on ? '❚❚' : '▶';
    play.setAttribute('aria-label', on ? 'Stop scrolling' : 'Start scrolling');
    shield.classList.toggle('hidden', !on);
    wake(on); show();
  }
  play.onclick = function(){ setPlay(!on); };
  document.addEventListener('keydown', function(e){
    if(e.code==='Space' && e.target.tagName!=='INPUT' && !view.classList.contains('hidden')){ e.preventDefault(); setPlay(!on); }
  });

  function tick(ts){
    if(on){
      if(last && ts-last < 250){   // skip long gaps so the page does not jump
        acc += set.speed * (ts-last) / 1000;
        var d = Math.floor(acc);
        if(d>0){
          var before = view.scrollTop;
          view.scrollTop += d; acc -= d;
          if(view.scrollTop===before && before>0) setPlay(false);
        }
      }
      last = ts;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function open(u){
    $('start').classList.add('hidden');
    view.classList.remove('hidden'); ctrl.classList.remove('hidden');
    frame.src = u; layout(); view.scrollTop = 0; show();
  }
  $('test').onclick = function(e){ e.preventDefault(); open('test.html'); };
  $('go').onsubmit = function(e){
    e.preventDefault();
    var u = $('url').value.trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u)) u = 'https://'+u;
    $('url').value = u; save('sr-url', u); $('url').blur();
    open(u);
  };
  $('close').onclick = function(){
    setPlay(false); frame.src = 'about:blank';
    view.classList.add('hidden'); ctrl.classList.add('hidden');
    $('start').classList.remove('hidden');
  };
  window.addEventListener('resize', layout);

  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  labels(); layout();
})();
</script>
</body>
</html>
