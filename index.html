<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scroller</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scroller">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--paper:#f3f4f6;--ink:#000;--sub:#5d6068;--line:#d4d6db;--field:#fff;--accent:#0a5cff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#000;--ink:#f2f2f2;--sub:#a0a3aa;--line:#2c2e33;--field:#16171a;--accent:#5b93ff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{min-height:100dvh;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-left));
  background:var(--paper);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
form{width:min(100%,32rem)}
h1{margin:0 0 16px;font-size:2rem;font-weight:800}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;padding:12px 14px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.field button{padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
p{margin:14px 2px 0;color:var(--sub);font-size:.9rem;line-height:1.5}
a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<form id="go">
  <h1>Scroller</h1>
  <div class="field">
    <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Paste a web address" aria-label="Web address">
    <button type="submit">Open</button>
  </div>
  <p>The page opens with small buttons at the bottom. Tap ▶ to scroll. The buttons fade away. Tap the page to show them again. <a href="test.html">Open the test page</a>.</p>
</form>
<script>
(function(){
  var input = document.getElementById('url');
  try{ input.value = localStorage.getItem('sr-url') || ''; }catch(e){}
  document.getElementById('go').onsubmit = function(e){
    e.preventDefault();
    var u = input.value.trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u)) u = 'https://'+u;
    try{ localStorage.setItem('sr-url', u); }catch(e){}
    location.href = 'api/read?url=' + encodeURIComponent(u);
  };
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
